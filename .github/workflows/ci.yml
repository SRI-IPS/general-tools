name: C++ and Python CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
  
jobs:
  build-and-test:
    runs-on: ubuntu-latest # Uses GitHub's free hosted Linux runner

    steps:
    - name: Check out repository code
      uses: actions/checkout@v4

    - name: Get runner user and group IDs
      id: get-ids
      run: |
        echo "uid=$(id -u)" >> $GITHUB_OUTPUT
        echo "gid=$(id -g)" >> $GITHUB_OUTPUT

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        load: true
        tags: a17-tools-dev:latest
        # Uses GitHub Actions built-in cache cache backend instead of local file mounts
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Run CI Script
      run: |
        chmod +x run-ci.sh
        ./run-ci.sh
